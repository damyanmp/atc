name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Ruff lint
        run: uv run ruff check src tests
        continue-on-error: true   # advisory only — 136 pre-existing findings not yet triaged (see pyproject.toml)

      - name: mypy
        run: uv run mypy src
        continue-on-error: true   # advisory only until the codebase is fully typed

      - name: pytest with coverage
        run: uv run pytest --cov=src --cov-report=term-missing
