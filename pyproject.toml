[project]
name = "atc"
version = "0.1.0"
description = "Air Traffic Control — homelab CLI for Proxmox, VMs, LXCs, and DSM"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.89",
    "proxmoxer>=2.0",
    "requests>=2.31",
    "asyncssh>=2.14",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "rich>=13.0",
    "typer>=0.12",
    "keyring>=25.0",
    "cryptography>=40.0",
    "qrcode>=8.0",
    "keyrings-alt>=5.0.2",
    "keyrings-cryptfile>=1.3.9",
]

[project.scripts]
atc = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "textual-dev>=1.0",
    "pyinstaller>=6.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
    "mypy>=2.3.1",
]

[tool.pytest.ini_options]
# Add src/ and src/lib/ to sys.path so bare imports (e.g. "from config import …",
# and lib/hosts.py's "from beszel import …") work in tests same as at runtime.
pythonpath = ["src", "src/lib"]
testpaths  = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Minimal, high-signal ruleset for a codebase that was never linted before —
# real bugs (F) and import hygiene (I), not full opinionated style (see
# `ruff check --select ALL` for the long tail deliberately left off: BLE001
# blind-except, S110/S112 bare try/except, DTZ00x naive datetimes, etc. —
# those are real but numerous pre-existing patterns, not regressions, and
# fixing them is a separate deliberate pass, not part of CI gating).
select = ["E", "F", "UP", "B"]
ignore = [
    "B008",  # function-call-in-default-argument — Typer's idiom (typer.Option(...) as a default)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# Advisory only (see CI: mypy step is continue-on-error) until the codebase
# has type annotations added deliberately — not enforced as a merge gate yet.
check_untyped_defs = false
