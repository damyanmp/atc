[project]
name = "atc"
version = "0.1.0"
description = "Air Traffic Control — homelab CLI for Proxmox, VMs, LXCs, and DSM"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.89",
    "proxmoxer>=2.0",
    "requests>=2.31",
    "asyncssh>=2.14",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "rich>=13.0",
    "typer>=0.12",
    "keyring>=25.0",
    "cryptography>=40.0",
]

[project.scripts]
atc = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "textual-dev>=1.0",
]
